<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iloveRedGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF3E4A" />
      <stop offset="100%" stop-color="#E5293E" />
    </linearGradient>
  </defs>

  <!-- Red Squircle Background matching iLove branding -->
  <rect x="24" y="24" width="464" height="464" rx="136" ry="136" fill="url(#iloveRedGradient)" />

  <!-- Stylized Tilted Music Note in Pure White -->
  <g fill="#FFFFFF">
    <!-- Circular Note Head -->
    <circle cx="212" cy="320" r="54" />

    <!-- Upward Angled Stem -->
    <polygon points="246,312 288,152 312,158 270,318" />

    <!-- Triangular Flared Flag / Pennant -->
    <path d="M 288 152 L 358 196 L 312 248 L 294 186 Z" />
  </g>
</svg>
