<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0052FF" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Blue Glow Background Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGradient)" filter="url(#glow)" />

  <!-- White Music Note Symbol -->
  <g transform="translate(135, 120) scale(10.2)">
    <!-- Filled Note Heads -->
    <ellipse cx="6" cy="18" rx="3.2" ry="2.6" transform="rotate(-15 6 18)" fill="#FFFFFF" />
    <ellipse cx="17" cy="15.5" rx="3.2" ry="2.6" transform="rotate(-15 17 15.5)" fill="#FFFFFF" />

    <!-- Stems & Beam -->
    <path d="M9 17.5 V5.5 L20 3.2 V15" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M9 5.5 L20 3.2 V7.8 L9 10.1 Z" fill="#FFFFFF" />
  </g>
</svg>
